
name: GCT Playwright Behave Tests

# Run the workflow whenever code is pushed or a pull request is created.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Behave Tests
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      # Step 1: Download the project source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Step 3: Install Python dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Install Playwright Chromium and system dependencies.
      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      # Step 5: Run Behave tests and generate Allure results.
      - name: Run Behave tests
        run: |
          python -m behave features/gct_tests.feature \
            --tags="not @intentional_failure" \
            -f allure_behave.formatter:AllureFormatter \
            -o allure-results \
            --no-capture

      # Step 6: Set up Java for Allure CLI.
      - name: Set up Java
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Step 7: Install Allure command-line tool.
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      # Step 8: Generate the Allure HTML report.
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found. Report generation skipped."
          fi

      # Step 9: Upload reports and test evidence.
      # always() uploads available evidence even when tests fail.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GCT-Playwright-Test-Reports
          path: |
            allure-results/
            allure-report/
            screenshots/
            videos/
            traces/
          if-no-files-found: warn
          retention-days: 14
